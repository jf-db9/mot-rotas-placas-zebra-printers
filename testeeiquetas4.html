<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Estação de Etiquetas Zebra Térmica</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0f172a;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* BARRA SUPERIOR */
    header {
      background: #1e293b;
      color: #fff;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #334155;
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-left h1 { font-size: 16px; font-weight: 800; letter-spacing: -0.3px; }
    .header-left span { font-size: 12px; color: #94a3b8; }
    .header-actions { display: flex; gap: 8px; }
    .btn {
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #334155; color: #f8fafc; }
    .btn-secondary:hover { background: #475569; }

    /* LAYOUT PRINCIPAL */
    .workspace {
      display: flex;
      flex: 1;
      height: calc(100vh - 53px);
      overflow: hidden;
    }

    /* BARRA LATERAL (CONFIGURAÇÕES E FILTROS) */
    .sidebar {
      width: 360px;
      background: #ffffff;
      border-right: 1px solid #cbd5e1;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-tabs {
      display: flex;
      border-bottom: 1px solid #e2e8f0;
      background: #f8fafc;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      font-size: 12px;
      font-weight: 700;
      border: none;
      background: transparent;
      color: #64748b;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .tab-btn.active {
      color: #2563eb;
      background: #ffffff;
      border-bottom-color: #2563eb;
    }
    .tab-content {
      padding: 14px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* CAMPOS E CONTROLOS */
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .control-group label {
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-text, .select-box {
      width: 100%;
      padding: 7px 10px;
      font-size: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #fff;
      color: #0f172a;
    }
    .input-text:focus, .select-box:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37,99,235,0.15);
    }
    .preset-pills { display: flex; gap: 6px; margin-top: 4px; }
    .pill {
      font-size: 11px;
      padding: 3px 8px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      color: #334155;
    }
    .pill:hover { background: #e2e8f0; }

    /* LISTA SELECIONÁVEL DE MOTORISTAS */
    .driver-list-box {
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      overflow-y: auto;
      max-height: 240px;
      background: #f8fafc;
    }
    .driver-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid #e2e8f0;
      font-size: 12px;
      cursor: pointer;
    }
    .driver-item:hover { background: #e0f2fe; }
    .driver-item input { cursor: pointer; }
    .driver-item-info { flex: 1; min-width: 0; }
    .driver-item-name { font-weight: 700; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .driver-item-meta { font-size: 10px; color: #64748b; font-family: monospace; }

    .alert-card {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 6px;
      padding: 10px;
      font-size: 11px;
      color: #92400e;
      line-height: 1.4;
    }

    /* ÁREA DE PRÉ-VISUALIZAÇÃO CENTRAL */
    .preview-canvas {
      flex: 1;
      background: #64748b;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* ETIQUETA TÉRMICA (ESTRUTURA FÍSICA) */
    .thermal-label {
      background: #ffffff;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      page-break-after: always;
      break-after: page;
      box-sizing: border-box;
      position: relative;
    }

    .info-pane {
      flex: 1;
      min-width: 0;
      padding-right: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
    }
    .meta-tag {
      font-size: 8px;
      font-weight: 900;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }
    .label-driver {
      font-size: 17px;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1.1;
      color: #000000;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .bottom-row {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      margin-top: 8px;
    }
    .label-route {
      display: inline-block;
      background: #000000;
      color: #ffffff;
      font-size: 17px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 4px;
      line-height: 1;
    }
    .label-plate {
      font-size: 12px;
      font-weight: 900;
      color: #1e293b;
      font-family: monospace;
      letter-spacing: 0.5px;
    }

    .qr-pane {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-left: 2px solid #000000;
      padding-left: 10px;
      flex-shrink: 0;
    }
    .qr-block {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .qr-block svg { display: block; }
    .qr-subtag {
      font-size: 7px;
      font-weight: 900;
      text-transform: uppercase;
      color: #000000;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    /* REGRAS DE IMPRESSÃO (CONTROLO ABSOLUTO) */
    @media print {
      body, html {
        background: #ffffff !important;
        margin: 0 !important;
        padding: 0 !important;
        height: auto !important;
        overflow: visible !important;
      }
      header, .sidebar, .no-print {
        display: none !important;
      }
      .workspace {
        display: block !important;
        height: auto !important;
        overflow: visible !important;
      }
      .preview-canvas {
        background: transparent !important;
        padding: 0 !important;
        display: block !important;
        height: auto !important;
        overflow: visible !important;
      }
      .thermal-label {
        border: none !important;
        box-shadow: none !important;
        margin: 0 !important;
        padding: 2.5mm 3.5mm !important;
        page-break-after: always !important;
        break-after: page !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }
  </style>

  <!-- Tag dinâmica de impressão ajustada em tempo real -->
  <style id="dynamic-page-rule"></style>
</head>
<body>

  <!-- CABEÇALHO -->
  <header>
    <div class="header-left">
      <h1>ESTAÇÃO TÉRMICA ZEBRA</h1>
      <span id="summary-counter">56 Registos Prontos</span>
    </div>
    <div class="header-actions">
      <button onclick="testSingleLabel()" class="btn btn-secondary">
        Testar 1 Etiqueta
      </button>
      <button onclick="window.print()" class="btn btn-primary">
        Imprimir Selecionados (Ctrl + P)
      </button>
    </div>
  </header>

  <!-- ÁREA DE TRABALHO -->
  <div class="workspace">
    
    <!-- BARRA LATERAL -->
    <aside class="sidebar">
      <div class="sidebar-tabs">
        <button class="tab-btn active" onclick="switchTab('tab-print')">Calibração</button>
        <button class="tab-btn" onclick="switchTab('tab-data')">Lista & Pesquisa</button>
      </div>

      <!-- ABA 1: CONFIGURAÇÃO DE IMPRESSÃO -->
      <div id="tab-print" class="tab-content">
        
        <div class="alert-card">
          <strong>Configuração no Ctrl + P:</strong><br>
          1. <b>Margens:</b> Selecione <b>Nenhuma</b>.<br>
          2. <b>Gráficos de segundo plano:</b> Marque a caixa.
        </div>

        <div class="control-group">
          <label>Tamanho da Etiqueta (mm)</label>
          <div style="display: flex; gap: 8px;">
            <input type="number" id="lbl-w" value="100" class="input-text" title="Largura">
            <input type="number" id="lbl-h" value="50" class="input-text" title="Altura">
          </div>
          <div class="preset-pills">
            <span class="pill" onclick="setPreset(100, 50)">100x50 mm</span>
            <span class="pill" onclick="setPreset(100, 30)">100x30 mm</span>
            <span class="pill" onclick="setPreset(80, 40)">80x40 mm</span>
          </div>
        </div>

        <div class="control-group">
          <label>Orientação do Papel</label>
          <select id="lbl-orientation" class="select-box" onchange="applyCalibration()">
            <option value="landscape" selected>Paisagem (Horizontal / Padrão Zebra)</option>
            <option value="portrait">Retrato (Vertical)</option>
          </select>
        </div>

        <div class="control-group">
          <label>Escala de Ajuste Fino</label>
          <select id="lbl-scale" class="select-box" onchange="applyCalibration()">
            <option value="1">100% (Normal)</option>
            <option value="0.95">95% (Evita cortes de borda)</option>
            <option value="0.90">90% (Reduzido)</option>
            <option value="1.05">105% (Expandido)</option>
          </select>
        </div>

        <div class="control-group" style="flex-direction: row; align-items: center; gap: 8px; margin-top: 6px;">
          <input type="checkbox" id="clean-accents" checked onchange="renderLabels()" style="cursor: pointer;">
          <label for="clean-accents" style="margin: 0; cursor: pointer; text-transform: none;">Sem acentos no QR (Bipagem rápida em coletores)</label>
        </div>

      </div>

      <!-- ABA 2: LISTA DE DADOS E PESQUISA -->
      <div id="tab-data" class="tab-content" style="display: none;">
        
        <div class="control-group">
          <label>Pesquisa Rápida</label>
          <input type="text" id="search-box" placeholder="Filtrar por nome, rota ou placa..." class="input-text" oninput="filterDrivers()">
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size: 11px; font-weight: 700; color: #475569;" id="filtered-count">56 / 56 selecionados</span>
          <div style="display: flex; gap: 6px;">
            <button class="pill" onclick="toggleSelectAll(true)">Marcar Todos</button>
            <button class="pill" onclick="toggleSelectAll(false)">Desmarcar</button>
          </div>
        </div>

        <div class="driver-list-box" id="driver-selection-list"></div>

        <div class="control-group" style="flex: 1; display: flex; flex-direction: column;">
          <label>Texto Bruto (Motorista; Rota; Placa)</label>
          <textarea id="raw-data-input" class="input-text" style="flex: 1; resize: none; font-family: monospace; font-size: 11px;" oninput="parseRawData()"></textarea>
        </div>

      </div>

    </aside>

    <!-- PRÉ-VISUALIZAÇÃO CENTRAL DAS ETIQUETAS -->
    <main class="preview-canvas" id="preview-area"></main>

  </div>

  <!-- MOTOR QR CODE NATIVO E MATEMÁTICO (TOTALMENTE OFFLINE) -->
  <script>
    var PureQR = (function() {
      function QR8bitByte(data) { this.mode = 4; this.data = data; }
      QR8bitByte.prototype = {
        getLength: function() { return this.data.length; },
        write: function(buffer) {
          for (var i = 0; i < this.data.length; i++) buffer.put(this.data.charCodeAt(i), 8);
        }
      };

      function QRCodeModel(typeNumber, errorCorrectLevel) {
        this.typeNumber = typeNumber;
        this.errorCorrectLevel = errorCorrectLevel;
        this.modules = null;
        this.moduleCount = 0;
        this.dataList = [];
      }
      QRCodeModel.prototype = {
        addData: function(data) { this.dataList.push(new QR8bitByte(data)); },
        isDark: function(row, col) { return this.modules[row][col]; },
        getModuleCount: function() { return this.moduleCount; },
        make: function() {
          this.makeImpl(false, this.getBestMaskPattern());
        },
        makeImpl: function(test, maskPattern) {
          this.moduleCount = this.typeNumber * 4 + 17;
          this.modules = new Array(this.moduleCount);
          for (var row = 0; row < this.moduleCount; row++) {
            this.modules[row] = new Array(this.moduleCount);
            for (var col = 0; col < this.moduleCount; col++) this.modules[row][col] = null;
          }
          this.setupPositionProbePattern(0, 0);
          this.setupPositionProbePattern(this.moduleCount - 7, 0);
          this.setupPositionProbePattern(0, this.moduleCount - 7);
          this.setupTimingPattern();
          this.setupTypeInfo(test, maskPattern);
          if (this.typeNumber >= 7) this.setupTypeNumber(test);
          var data = QRCodeModel.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
          this.mapData(data, maskPattern);
        },
        setupPositionProbePattern: function(row, col) {
          for (var r = -1; r <= 7; r++) {
            if (row + r <= -1 || this.moduleCount <= row + r) continue;
            for (var c = -1; c <= 7; c++) {
              if (col + c <= -1 || this.moduleCount <= col + c) continue;
              if ((0 <= r && r <= 6 && (c == 0 || c == 6)) || (0 <= c && c <= 6 && (r == 0 || r == 6)) || (2 <= r && r <= 4 && 2 <= c && c <= 4)) {
                this.modules[row + r][col + c] = true;
              } else {
                this.modules[row + r][col + c] = false;
              }
            }
          }
        },
        setupTimingPattern: function() {
          for (var r = 8; r < this.moduleCount - 8; r++) {
            if (this.modules[r][6] != null) continue;
            this.modules[r][6] = (r % 2 == 0);
          }
          for (var c = 8; c < this.moduleCount - 8; c++) {
            if (this.modules[6][c] != null) continue;
            this.modules[6][c] = (c % 2 == 0);
          }
        },
        setupTypeInfo: function(test, maskPattern) {
          var data = (this.errorCorrectLevel << 3) | maskPattern;
          var bits = QRUtil.getBCHTypeInfo(data);
          for (var i = 0; i < 15; i++) {
            var mod = (!test && ((bits >> i) & 1) == 1);
            if (i < 6) this.modules[i][8] = mod;
            else if (i < 8) this.modules[i + 1][8] = mod;
            else this.modules[this.moduleCount - 15 + i][8] = mod;
            if (i < 8) this.modules[8][this.moduleCount - i - 1] = mod;
            else if (i < 9) this.modules[8][15 - i - 1 + 1] = mod;
            else this.modules[8][15 - i - 1] = mod;
          }
          this.modules[this.moduleCount - 8][8] = !test;
        },
        setupTypeNumber: function(test) {
          var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
          for (var i = 0; i < 18; i++) {
            var mod = (!test && ((bits >> i) & 1) == 1);
            this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
            this.modules[i % 3 + this.moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
          }
        },
        mapData: function(data, maskPattern) {
          var inc = -1, row = this.moduleCount - 1, bitIndex = 7, byteIndex = 0;
          for (var col = this.moduleCount - 1; col > 0; col -= 2) {
            if (col == 6) col--;
            while (true) {
              for (var c = 0; c < 2; c++) {
                if (this.modules[row][col - c] == null) {
                  var dark = false;
                  if (byteIndex < data.length) dark = (((data[byteIndex] >>> bitIndex) & 1) == 1);
                  var mask = QRUtil.getMask(maskPattern, row, col - c);
                  if (mask) dark = !dark;
                  this.modules[row][col - c] = dark;
                  bitIndex--;
                  if (bitIndex == -1) { byteIndex++; bitIndex = 7; }
                }
              }
              row += inc;
              if (row < 0 || this.moduleCount <= row) { row -= inc; inc = -inc; break; }
            }
          }
        },
        getBestMaskPattern: function() {
          var minLostPoint = 0, pattern = 0;
          for (var i = 0; i < 8; i++) {
            this.makeImpl(true, i);
            var lostPoint = QRUtil.getLostPoint(this);
            if (i == 0 || minLostPoint > lostPoint) { minLostPoint = lostPoint; pattern = i; }
          }
          return pattern;
        }
      };

      QRCodeModel.createData = function(typeNumber, errorCorrectLevel, dataList) {
        var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
        var buffer = new QRBitBuffer();
        for (var i = 0; i < dataList.length; i++) {
          var data = dataList[i];
          buffer.put(data.mode, 4);
          buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber));
          data.write(buffer);
        }
        var totalDataCount = 0;
        for (var i = 0; i < rsBlocks.length; i++) totalDataCount += rsBlocks[i].dataCount;
        if (buffer.getLengthInBits() > totalDataCount * 8) throw new Error("Texto muito longo.");
        if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) buffer.put(0, 4);
        while (buffer.getLengthInBits() % 8 != 0) buffer.putBit(false);
        while (true) {
          if (buffer.getLengthInBits() >= totalDataCount * 8) break;
          buffer.put(0xEC, 8);
          if (buffer.getLengthInBits() >= totalDataCount * 8) break;
          buffer.put(0x11, 8);
        }
        return QRCodeModel.createBytes(buffer, rsBlocks);
      };

      QRCodeModel.createBytes = function(buffer, rsBlocks) {
        var offset = 0, maxDcCount = 0, maxEcCount = 0;
        var dcdata = new Array(rsBlocks.length), ecdata = new Array(rsBlocks.length);
        for (var r = 0; r < rsBlocks.length; r++) {
          var dcCount = rsBlocks[r].dataCount, ecCount = rsBlocks[r].totalCount - dcCount;
          maxDcCount = Math.max(maxDcCount, dcCount);
          maxEcCount = Math.max(maxEcCount, ecCount);
          dcdata[r] = new Array(dcCount);
          for (var i = 0; i < dcdata[r].length; i++) dcdata[r][i] = 0xff & buffer.buffer[i + offset];
          offset += dcCount;
          var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
          var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);
          var modPoly = rawPoly.mod(rsPoly);
          ecdata[r] = new Array(rsPoly.getLength() - 1);
          for (var i = 0; i < ecdata[r].length; i++) {
            var modIndex = i + modPoly.getLength() - ecdata[r].length;
            ecdata[r][i] = (modIndex >= 0) ? modPoly.get(modIndex) : 0;
          }
        }
        var totalCodeCount = 0;
        for (var i = 0; i < rsBlocks.length; i++) totalCodeCount += rsBlocks[i].totalCount;
        var data = new Array(totalCodeCount), index = 0;
        for (var i = 0; i < maxDcCount; i++) {
          for (var r = 0; r < rsBlocks.length; r++) {
            if (i < dcdata[r].length) { data[index] = dcdata[r][i]; index++; }
          }
        }
        for (var i = 0; i < maxEcCount; i++) {
          for (var r = 0; r < rsBlocks.length; r++) {
            if (i < ecdata[r].length) { data[index] = ecdata[r][i]; index++; }
          }
        }
        return data;
      };

      var QRUtil = {
        PATTERN_POSITION_TABLE: [
          [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34],
          [6, 22, 38], [6, 24, 42], [6, 26, 46], [6, 28, 50], [6, 30, 54]
        ],
        G15: (1 << 10) | (1 << 8) | (1 << 5) | (1 << 4) | (1 << 2) | (1 << 1) | (1 << 0),
        G18: (1 << 12) | (1 << 11) | (1 << 10) | (1 << 9) | (1 << 8) | (1 << 5) | (1 << 2) | (1 << 0),
        G15_MASK: (1 << 14) | (1 << 12) | (1 << 10) | (1 << 4) | (1 << 1),
        getBCHTypeInfo: function(data) {
          var d = data << 10;
          while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) >= 0) {
            d ^= (QRUtil.G15 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15)));
          }
          return ((data << 10) | d) ^ QRUtil.G15_MASK;
        },
        getBCHTypeNumber: function(data) {
          var d = data << 12;
          while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) >= 0) {
            d ^= (QRUtil.G18 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18)));
          }
          return (data << 12) | d;
        },
        getBCHDigit: function(data) {
          var digit = 0;
          while (data != 0) { digit++; data >>>= 1; }
          return digit;
        },
        getMask: function(maskPattern, i, j) {
          switch (maskPattern) {
            case 0: return (i + j) % 2 == 0;
            case 1: return i % 2 == 0;
            case 2: return j % 3 == 0;
            case 3: return (i + j) % 3 == 0;
            case 4: return (Math.floor(i / 2) + Math.floor(j / 3)) % 2 == 0;
            case 5: return (i * j) % 2 + (i * j) % 3 == 0;
            case 6: return ((i * j) % 2 + (i * j) % 3) % 2 == 0;
            case 7: return ((i * j) % 3 + (i + j) % 2) % 2 == 0;
            default: return false;
          }
        },
        getErrorCorrectPolynomial: function(errorCorrectLength) {
          var a = new QRPolynomial([1], 0);
          for (var i = 0; i < errorCorrectLength; i++) a = a.multiply(new QRPolynomial([1, QRMath.gexp(i)], 0));
          return a;
        },
        getLengthInBits: function(mode, type) { return (type < 10) ? 8 : 16; },
        getLostPoint: function(qrCode) {
          var moduleCount = qrCode.getModuleCount(), lostPoint = 0;
          for (var row = 0; row < moduleCount; row++) {
            for (var col = 0; col < moduleCount; col++) {
              var sameCount = 0, dark = qrCode.isDark(row, col);
              for (var r = -1; r <= 1; r++) {
                if (row + r < 0 || moduleCount <= row + r) continue;
                for (var c = -1; c <= 1; c++) {
                  if (col + c < 0 || moduleCount <= col + c || (r == 0 && c == 0)) continue;
                  if (dark == qrCode.isDark(row + r, col + c)) sameCount++;
                }
              }
              if (sameCount > 5) lostPoint += (3 + sameCount - 5);
            }
          }
          return lostPoint;
        }
      };

      var QRMath = {
        glog: function(n) { return QRMath.LOG_TABLE[n]; },
        gexp: function(n) { while (n < 0) n += 255; while (n >= 255) n -= 255; return QRMath.EXP_TABLE[n]; },
        EXP_TABLE: new Array(256),
        LOG_TABLE: new Array(256)
      };
      for (var i = 0; i < 8; i++) QRMath.EXP_TABLE[i] = 1 << i;
      for (var i = 8; i < 256; i++) QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4] ^ QRMath.EXP_TABLE[i - 5] ^ QRMath.EXP_TABLE[i - 6] ^ QRMath.EXP_TABLE[i - 8];
      for (var i = 0; i < 255; i++) QRMath.LOG_TABLE[QRMath.EXP_TABLE[i]] = i;

      function QRPolynomial(num, shift) {
        var offset = 0;
        while (offset < num.length && num[offset] == 0) offset++;
        this.num = new Array(num.length - offset + shift);
        for (var i = 0; i < num.length - offset; i++) this.num[i] = num[i + offset];
      }
      QRPolynomial.prototype = {
        get: function(index) { return this.num[index]; },
        getLength: function() { return this.num.length; },
        multiply: function(e) {
          var num = new Array(this.getLength() + e.getLength() - 1);
          for (var i = 0; i < this.getLength(); i++) {
            for (var j = 0; j < e.getLength(); j++) num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i)) + QRMath.glog(e.get(j)));
          }
          return new QRPolynomial(num, 0);
        },
        mod: function(e) {
          if (this.getLength() - e.getLength() < 0) return this;
          var ratio = QRMath.glog(this.get(0)) - QRMath.glog(e.get(0));
          var num = new Array(this.getLength());
          for (var i = 0; i < this.getLength(); i++) num[i] = this.get(i);
          for (var i = 0; i < e.getLength(); i++) num[i] ^= QRMath.gexp(QRMath.glog(e.get(i)) + ratio);
          return new QRPolynomial(num, 0).mod(e);
        }
      };

      function QRRSBlock(totalCount, dataCount) { this.totalCount = totalCount; this.dataCount = dataCount; }
      // Tabela exata RS Block para Nível M (Versões 1 a 10)
      QRRSBlock.RS_TABLE_M = [
        [1, 26, 16], [1, 44, 28], [1, 70, 44], [2, 50, 32], [2, 67, 43],
        [4, 43, 27], [4, 49, 31], [2, 61, 38, 2, 62, 39], [3, 58, 36, 2, 59, 37], [4, 69, 43, 1, 70, 44]
      ];
      QRRSBlock.getRSBlocks = function(typeNumber) {
        var rs = QRRSBlock.RS_TABLE_M[typeNumber - 1];
        var list = [];
        for (var i = 0; i < rs.length; i += 3) {
          var count = rs[i], total = rs[i + 1], data = rs[i + 2];
          for (var j = 0; j < count; j++) list.push(new QRRSBlock(total, data));
        }
        return list;
      };

      function QRBitBuffer() { this.buffer = []; this.length = 0; }
      QRBitBuffer.prototype = {
        put: function(num, length) { for (var i = 0; i < length; i++) this.putBit(((num >>> (length - i - 1)) & 1) == 1); },
        getLengthInBits: function() { return this.length; },
        putBit: function(bit) {
          var bufIndex = Math.floor(this.length / 8);
          if (this.buffer.length <= bufIndex) this.buffer.push(0);
          if (bit) this.buffer[bufIndex] |= (0x80 >>> (this.length % 8));
          this.length++;
        }
      };

      // Devolve diretamente uma string SVG pura (independente de canvas, imagens externas ou internet)
      return {
        createSVG: function(text, sizePx) {
          sizePx = sizePx || 100;
          for (var type = 1; type <= 10; type++) {
            try {
              var qrcode = new QRCodeModel(type, 0); // nível M
              qrcode.addData(unescape(encodeURIComponent(text)));
              qrcode.make();
              var count = qrcode.getModuleCount();
              var rects = [];
              for (var r = 0; r < count; r++) {
                for (var c = 0; c < count; c++) {
                  if (qrcode.isDark(r, c)) rects.push('<rect x="' + c + '" y="' + r + '" width="1" height="1" fill="#000000"/>');
                }
              }
              return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + count + ' ' + count + '" width="' + sizePx + '" height="' + sizePx + '" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#ffffff"/>' + rects.join('') + '</svg>';
            } catch(e) {
              if (type == 10) return '<div style="font-size:8px;color:red;">Erro QR</div>';
            }
          }
        }
      };
    })();
  </script>

    let driversData = [];

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).style.display = 'flex';
      event.target.classList.add('active');
    }

    function setPreset(w, h) {
      document.getElementById('lbl-w').value = w;
      document.getElementById('lbl-h').value = h;
      applyCalibration();
    }

    function sanitizeForReader(str) {
      if (!str) return '';
      return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    }

    function applyCalibration() {
      const w = document.getElementById('lbl-w').value || 100;
      const h = document.getElementById('lbl-h').value || 50;
      const orientation = document.getElementById('lbl-orientation').value;
      const scale = document.getElementById('lbl-scale').value || 1;

      document.getElementById('dynamic-page-rule').innerHTML = `
        @page {
          size: ${w}mm ${h}mm ${orientation};
          margin: 0mm !important;
        }
        .thermal-label {
          width: ${w}mm !important;
          height: ${h}mm !important;
          transform: scale(${scale});
          transform-origin: center center;
        }
      `;
      renderLabels();
    }

    function parseRawData() {
      const raw = document.getElementById('raw-data-input').value;
      const lines = raw.split('\n').filter(l => l.trim().length > 0);
      driversData = lines.map((line, idx) => {
        let parts = line.split(/[;\t]/);
        if (parts.length < 2) parts = line.split(',');
        const name = (parts[0] || '').trim();
        const route = (parts[1] || '').trim();
        const plate = (parts[2] || '').trim().toUpperCase();
        return {
          id: idx,
          name: name,
          route: route,
          plate: plate,
          hasPlate: Boolean(plate && plate !== '-' && plate !== 'S/P' && plate !== 'N/A'),
          selected: true
        };
      });
      buildSelectionList();
      renderLabels();
    }

    function buildSelectionList() {
      const container = document.getElementById('driver-selection-list');
      container.innerHTML = '';
      const filter = (document.getElementById('search-box').value || '').toLowerCase();

      let visibleCount = 0;
      let selectedCount = 0;

      driversData.forEach(d => {
        const matches = d.name.toLowerCase().includes(filter) ||
                        d.route.toLowerCase().includes(filter) ||
                        d.plate.toLowerCase().includes(filter);

        if (d.selected) selectedCount++;
        if (!matches) return;
        visibleCount++;

        const item = document.createElement('div');
        item.className = 'driver-item';
        item.innerHTML = `
          <input type="checkbox" ${d.selected ? 'checked' : ''} onchange="toggleDriver(${d.id})">
          <div class="driver-item-info" onclick="toggleDriver(${d.id})">
            <div class="driver-item-name">${d.name}</div>
            <div class="driver-item-meta">ROTA: ${d.route} ${d.hasPlate ? '| ' + d.plate : ''}</div>
          </div>
        `;
        container.appendChild(item);
      });

      document.getElementById('filtered-count').textContent = `${selectedCount} / ${driversData.length} selecionados`;
      document.getElementById('summary-counter').textContent = `${selectedCount} Etiquetas Prontas`;
    }

    function toggleDriver(id) {
      const target = driversData.find(d => d.id === id);
      if (target) {
        target.selected = !target.selected;
        buildSelectionList();
        renderLabels();
      }
    }

    function toggleSelectAll(status) {
      driversData.forEach(d => d.selected = status);
      buildSelectionList();
      renderLabels();
    }

    function filterDrivers() {
      buildSelectionList();
    }

    function renderLabels() {
      const clean = document.getElementById('clean-accents').checked;
      const preview = document.getElementById('preview-area');
      preview.innerHTML = '';

      const activeDrivers = driversData.filter(d => d.selected);

      if (activeDrivers.length === 0) {
        preview.innerHTML = `<div style="background:#fff;padding:24px;border-radius:8px;color:#64748b;font-weight:700;">Nenhum motorista selecionado.</div>`;
        return;
      }

      activeDrivers.forEach(d => {
        const qrName = clean ? sanitizeForReader(d.name) : d.name;
        const driverSvg = PureQR.createSVG(qrName, d.hasPlate ? 66 : 94);
        const plateSvg = d.hasPlate ? PureQR.createSVG(d.plate, 44) : '';

        const card = document.createElement('div');
        card.className = 'thermal-label';
        card.innerHTML = `
          <!-- INFORMAÇÃO OPERACIONAL -->
          <div class="info-pane">
            <div>
              <span class="meta-tag">MOTORISTA</span>
              <div class="label-driver">${d.name}</div>
            </div>
            <div class="bottom-row">
              <div>
                <span class="meta-tag" style="display:block;margin-bottom:2px;">ROTA</span>
                <span class="label-route">${d.route || '-'}</span>
              </div>
              ${d.hasPlate ? `
                <div style="padding-bottom: 2px;">
                  <span class="meta-tag" style="display:block;margin-bottom:2px;">PLACA</span>
                  <span class="label-plate">${d.plate}</span>
                </div>
              ` : ''}
            </div>
          </div>

          <!-- QR CODES NATIVOS -->
          <div class="qr-pane">
            <div class="qr-block">
              ${driverSvg}
              <span class="qr-subtag">MOTORISTA</span>
            </div>
            ${d.hasPlate ? `
              <div class="qr-block" style="border-top: 1px solid #000; padding-top: 4px;">
                ${plateSvg}
                <span class="qr-subtag">PLACA</span>
              </div>
            ` : ''}
          </div>
        `;
        preview.appendChild(card);
      });
    }

    function testSingleLabel() {
      if (driversData.length === 0) return;
      driversData.forEach((d, idx) => d.selected = (idx === 0));
      buildSelectionList();
      renderLabels();
      window.print();
    }

    window.onload = function() {
      document.getElementById('raw-data-input').value = INITIAL_RECORDS;
      parseRawData();
      applyCalibration();
      document.getElementById('lbl-w').onchange = applyCalibration;
      document.getElementById('lbl-h').onchange = applyCalibration;
    };
